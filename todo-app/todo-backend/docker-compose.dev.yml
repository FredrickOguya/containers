
services:
  server:
    build:
      context: .
      dockerfile: dev.Dockerfile
    ports:
      - "3000:3001"
    volumes:
      - ./:/usr/src/app
      - /usr/src/app/node_modules
    environment:
      - MONGO_URL=mongodb://mongo:27017/todo-app
      - REDIS_URL=redis://redis:6379
    depends_on:
      - mongo
      - redis
  mongo:
    image: mongo
    volumes:
      - mongo_data:/data/db

  redis:
    image: redis

volumes:
  mongo_data:
